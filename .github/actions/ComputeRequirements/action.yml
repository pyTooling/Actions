name: Compute paths to requirements files
branding:
  icon: file-text
  color: green
description: Resolve a './'-prefixed requirements file against a base directory and check that it exists.
author: Patrick Lehmann (@Paebbels)

inputs:
  requirements:
    description: "Python dependencies to be installed through pip. Either '-r <path>' or a space separated list of dependencies."
    required: true
    type: string
  mingw_requirements:
    description: "Override of 'requirements' for MSYS2 (MINGW64). If empty, 'requirements' is used on MSYS2 too."
    required: false
    default: ''
    type: string
  base_directory:
    description: "Directory a './'-prefixed requirements file is resolved against."
    required: false
    default: '.'
    type: string

outputs:
  requirements:
    description: "Resolved 'requirements' - a '-r <path>' with a checked path, or the unchanged dependency list."
    value: ${{ steps.compute.outputs.requirements }}
  mingw_requirements:
    description: "Resolved requirements to install on MSYS2 - 'mingw_requirements' if it was given, else 'requirements'."
    value: ${{ steps.compute.outputs.mingw_requirements }}

runs:
  using: composite
  steps:
    - name: Compute paths to requirements files
      id: compute
      shell: python
      run: |
        from os      import getenv
        from pathlib import Path
        from sys     import version

        print(f"Python: {version}")

        baseDirectory = Path("${{ inputs.base_directory }}")

        def resolve(name: str, requirements: str) -> str:
          """Resolve a './'-prefixed requirements file against the base directory and check it exists."""
          if not requirements.startswith("-r"):
            print(f"{name} list: {requirements}")
            return requirements

          requirements = requirements[2:].lstrip()
          requirementsFile = baseDirectory / requirements[2:] if requirements.startswith("./") else Path(requirements)

          if not requirementsFile.exists():
            print(f"::error title=FileNotFoundError::Requirements file '{requirementsFile}' doesn't exist.")
            exit(1)

          print(f"{name} file: {requirementsFile.as_posix()}")
          return f"-r {requirementsFile.as_posix()}"

        requirements = resolve("requirements", """${{ inputs.requirements }}""".strip())

        # An empty 'mingw_requirements' means "no override", so MSYS2 installs the same requirements as every
        # other system. Emitting the fallback here keeps the decision in one place instead of in every caller.
        mingwRequirements = """${{ inputs.mingw_requirements }}""".strip()
        mingwRequirements = resolve("mingw_requirements", mingwRequirements) if mingwRequirements != "" else requirements

        # Write resolved requirements to special file
        github_output = Path(getenv("GITHUB_OUTPUT"))
        print(f"GITHUB_OUTPUT: {github_output}")
        with github_output.open("a+") as f:
          f.write(f"requirements={requirements}\n")
          f.write(f"mingw_requirements={mingwRequirements}\n")
