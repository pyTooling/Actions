name: Verification Pipeline for Parameters
run-name: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}  # tag pushes can publish a release, so never cancel those

jobs:
  Params_Default:
    uses: pyTooling/Actions/.github/workflows/Parameters.yml@r8
    with:
      name: Example

  Params_PythonVersions:
    uses: pyTooling/Actions/.github/workflows/Parameters.yml@r8
    with:
      name: Example
      python_version_list: "3.12 3.13 pypy-3.10 pypy-3.11"       # py-2, py-1, pypy-1, pypy-0

  Params_Systems:
    uses: pyTooling/Actions/.github/workflows/Parameters.yml@r8
    with:
      name: Example
      system_list: "windows mingw32 mingw64"

  Params_Include:
    uses: pyTooling/Actions/.github/workflows/Parameters.yml@r8
    with:
      name: Example
      python_version_list: "3.12"                                # py-2
      system_list: "ubuntu windows macos macos-arm"
      include_list: "ubuntu:3.13 ubuntu:3.14 ubuntu-arm:3.12"

  Params_Exclude:
    uses: pyTooling/Actions/.github/workflows/Parameters.yml@r8
    with:
      name: Example
      python_version_list: "3.13"                                # py-1
      system_list: "ubuntu windows macos macos-arm"
      exclude_list: "windows:3.13 windows:3.14"

  Params_Disable:
    uses: pyTooling/Actions/.github/workflows/Parameters.yml@r8
    with:
      name: Example
      python_version_list: "3.13"                                # py-1
      system_list: "ubuntu windows macos macos-arm"
      disable_list: "windows:3.13 windows:3.14"

  Params_All:
    uses: pyTooling/Actions/.github/workflows/Parameters.yml@r8
    with:
      name: Example
      python_version_list: "3.12 3.13"                           # py-2, py-1
      system_list: "ubuntu windows macos macos-arm"
      include_list: "windows:3.10 windows:3.11 windows:3.13"
      exclude_list: "macos:3.12 macos:3.13"

  Params_Check_Default:
    needs:
      - Params_Default
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: python
    steps:
      - name: Checkout repository to access local Action
        uses: actions/checkout@v7

      - name: Checking job matrix from 'Params_Default'
        uses: ./.github/actions/CheckJobMatrix
        with:
          expected-default-version: '3.14'
          expected-python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
          expected-systems:         '["ubuntu", "ubuntu-arm", "windows", "windows-arm", "macos", "macos-arm"]'
          expected-exclude-jobs:    '["windows-arm:3.10"]'
          expected-include-jobs:    '["mingw64:3.14", "ucrt64:3.14"]'
          generated-default-version: ${{ needs.Params_Default.outputs.python_version }}
          generated-jobmatrix:       ${{ needs.Params_Default.outputs.python_jobs }}

      - name: Checking artifact names from 'Params_Default'
        uses: ./.github/actions/CheckArtifactNames
        with:
          prefix: 'Example'
          generated-names: ${{ needs.Params_Default.outputs.artifact_names }}

  Params_Check_PythonVersions:
    needs:
      - Params_PythonVersions
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: python
    steps:
      - name: Checkout repository to access local Action
        uses: actions/checkout@v7

      - name: Checking job matrix from 'Params_PythonVersions'
        uses: ./.github/actions/CheckJobMatrix
        with:
          expected-default-version: '3.14'
          expected-python-versions: '["3.12", "3.13", "pypy-3.10", "pypy-3.11"]'
          expected-systems:         '["ubuntu", "ubuntu-arm", "windows", "windows-arm", "macos", "macos-arm"]'
          expected-exclude-jobs:    '["windows-arm:pypy-3.10", "windows-arm:pypy-3.11"]'
          expected-include-jobs:    '["mingw64:3.14", "ucrt64:3.14"]'
          generated-default-version: ${{ needs.Params_PythonVersions.outputs.python_version }}
          generated-jobmatrix:       ${{ needs.Params_PythonVersions.outputs.python_jobs }}

  Params_Check_Systems:
    needs:
      - Params_Systems
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: python
    steps:
      - name: Checkout repository to access local Action
        uses: actions/checkout@v7

      - name: Checking job matrix from 'Params_Systems'
        uses: ./.github/actions/CheckJobMatrix
        with:
          expected-default-version: '3.14'
          expected-python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
          expected-systems:         '["windows"]'
          expected-exclude-jobs:    '[]'
          expected-include-jobs:    '["mingw32:3.14", "mingw64:3.14"]'
          generated-default-version: ${{ needs.Params_Systems.outputs.python_version }}
          generated-jobmatrix:       ${{ needs.Params_Systems.outputs.python_jobs }}

  Params_Check_Include:
    needs:
      - Params_Include
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: python
    steps:
      - name: Checkout repository to access local Action
        uses: actions/checkout@v7

      - name: Checking job matrix from 'Params_Include'
        uses: ./.github/actions/CheckJobMatrix
        with:
          expected-default-version: '3.14'
          expected-python-versions: '["3.12"]'
          expected-systems:         '["ubuntu", "windows", "macos", "macos-arm"]'
          expected-exclude-jobs:    '[]'
          expected-include-jobs:    '["ubuntu:3.13", "ubuntu:3.14", "ubuntu-arm:3.12"]'
          generated-default-version: ${{ needs.Params_Include.outputs.python_version }}
          generated-jobmatrix:       ${{ needs.Params_Include.outputs.python_jobs }}

  Params_Check_Exclude:
    needs:
      - Params_Exclude
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: python
    steps:
      - name: Checkout repository to access local Action
        uses: actions/checkout@v7

      - name: Checking job matrix from 'Params_Exclude'
        uses: ./.github/actions/CheckJobMatrix
        with:
          expected-default-version: '3.14'
          expected-python-versions: '["3.13"]'
          expected-systems:         '["ubuntu", "macos", "macos-arm"]'
          expected-exclude-jobs:    '[]'
          expected-include-jobs:    '[]'
          generated-default-version: ${{ needs.Params_Exclude.outputs.python_version }}
          generated-jobmatrix:       ${{ needs.Params_Exclude.outputs.python_jobs }}

  Params_Check_Disable:
    needs:
      - Params_Disable
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: python
    steps:
      - name: Checkout repository to access local Action
        uses: actions/checkout@v7

      - name: Checking job matrix from 'Params_Disable'
        uses: ./.github/actions/CheckJobMatrix
        with:
          expected-default-version: '3.14'
          expected-python-versions: '["3.13"]'
          expected-systems:         '["ubuntu", "windows", "macos", "macos-arm"]'
          expected-exclude-jobs:    '["windows:3.13"]'
          expected-include-jobs:    '[]'
          generated-default-version: ${{ needs.Params_Disable.outputs.python_version }}
          generated-jobmatrix:       ${{ needs.Params_Disable.outputs.python_jobs }}

  Params_Check_All:
    needs:
      - Params_All
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: python
    steps:
      - name: Checkout repository to access local Action
        uses: actions/checkout@v7

      - name: Checking job matrix from 'Params_All'
        uses: ./.github/actions/CheckJobMatrix
        with:
          expected-default-version: '3.14'
          expected-python-versions: '["3.12", "3.13"]'
          expected-systems:         '["ubuntu", "windows", "macos-arm"]'
          expected-exclude-jobs:    '[]'
          expected-include-jobs:    '["windows:3.10", "windows:3.11", "windows:3.13"]'
          generated-default-version: ${{ needs.Params_All.outputs.python_version }}
          generated-jobmatrix:       ${{ needs.Params_All.outputs.python_jobs }}

  Requirements_Check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository to access local Action
        uses: actions/checkout@v7

      - name: Create requirements files to resolve
        shell: bash
        run: |
          mkdir -p checking-requirements
          printf -- 'pytest ~= 8.0\nruamel.yaml ~= 0.19.1\n-r ./more.txt\n'                       > checking-requirements/requirements.txt
          printf -- 'jsonschema ~= 4.26\npyEDAA.Reports ~= 0.18\npyTooling[yaml,pypi,sphinx] ~= 9.0\nsphinx_reports ~= 0.11\n' > checking-requirements/more.txt
          printf -- 'lxml ~= 6.0\n'                                                              > checking-requirements/mingw.txt

      - name: Computing requirements paths
        id: requirements
        uses: ./.github/actions/ComputeRequirements
        with:
          requirements:       '-r ./requirements.txt'
          mingw_requirements: '-r ./mingw.txt'
          base_directory:     './checking-requirements'

      - name: Computing pacboy packages
        id: pacboy
        uses: ./.github/actions/ComputePacboyPackages
        with:
          requirements: ${{ steps.requirements.outputs.requirements }}

      - name: Computing the StaticTypeCheck default against this repository's layout
        id: typing
        uses: ./.github/actions/ComputeRequirements
        with:
          requirements:   '-r ./requirements.txt'
          base_directory: './tests/typing'

      - name: Checking computed requirements and pacboy packages
        shell: python
        env:
          REQUIREMENTS:        ${{ steps.requirements.outputs.requirements }}
          MINGW_REQUIREMENTS:  ${{ steps.requirements.outputs.mingw_requirements }}
          PACBOY_PACKAGES:     ${{ steps.pacboy.outputs.pacboy_packages }}
          TYPING_REQUIREMENTS: ${{ steps.typing.outputs.requirements }}
        run: |
          from os  import getenv
          from sys import exit

          errors = 0

          def check(name: str, actual, expected) -> None:
            global errors
            if actual != expected:
              print(f"❌ {name} does not match: {actual} != {expected}.")
              errors += 1
            else:
              print(f"☑ {name} as expected: {actual}.")

          # A './'-prefixed path is resolved against the base directory ...
          check("requirements", getenv("REQUIREMENTS"), "-r checking-requirements/requirements.txt")
          # ... and 'mingw_requirements' is resolved the same way, instead of being passed through unchanged.
          check("mingw_requirements", getenv("MINGW_REQUIREMENTS"), "-r checking-requirements/mingw.txt")

          # 'pyEDAA.Reports' is looked up in lower-case, 'pyTooling[yaml,pypi,sphinx]' contributes through its
          # sub-packages, and the nested '-r ./more.txt' is followed. Compare the packages as a set: the rewrite
          # rules are multi-word strings, so the joined output repeats a package that two rules name.
          check(
            "pacboy_packages",
            set(getenv("PACBOY_PACKAGES").split()),
            {
              "python-aiohttp:p",             # pyTooling[pypi]
              "python-coverage:p",            # sphinx_reports
              "python-jsonschema:p",          # jsonschema
              "python-lxml:p",                # pyEDAA.Reports, sphinx_reports
              "python-markupsafe:p",          # pyTooling[sphinx], sphinx_reports
              "python-pip:p",                 # always
              "python-pyaml:p",               # sphinx_reports
              "python-ruamel-yaml:p",         # ruamel.yaml, pyEDAA.Reports, pyTooling[yaml], sphinx_reports
              "python-ruamel.yaml.clib:p",    # ruamel.yaml, pyEDAA.Reports, pyTooling[yaml], sphinx_reports
              "python-tomli:p",               # always
              "python-types-pyyaml:p",        # sphinx_reports
              "python-wheel:p",               # always
            }
          )

          # The old literal default of 'StaticTypeCheck.yml', spelled out.
          check("StaticTypeCheck requirements", getenv("TYPING_REQUIREMENTS"), "-r tests/typing/requirements.txt")

          if errors == 0:
            print("✅ All checks PASSED.")
          else:
            print(f"❌ Counted {errors} errors.")
            exit(errors)
