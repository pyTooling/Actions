name: Verification of Pipeline Templates (Simple Package)
run-name: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

on:
  workflow_call:
  workflow_dispatch:

jobs:
  SimplePackage:
    uses: pyTooling/Actions/.github/workflows/CompletePipeline.yml@dev
    with:
      package_name:        'myPackage'
      unittest_python_version_list: '3.14'               # NamespacePackage covers Python 3.11, so both pipelines together still test the version range's ends.
      unittest_system_list:         'ubuntu ubuntu-arm'
      apptest:             'true'
      apptest_python_version_list:  '3.14'
      apptest_system_list:          'ubuntu ubuntu-arm'
      bandit:              'true'
      pylint:              'true'
      codecov:             'true'
      codacy:              'true'
      dorny:               'true'
      documentation_steps: 'html latex'
      auto_tag:            'false'
      pypi_dry_run:        'true'   # 'myPackage'/'myFramework' are fixtures - never publish them
      cleanup:             'false'
    secrets:
      PYPI_TOKEN:    ${{ secrets.PYPI_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_TOKEN:  ${{ secrets.CODACY_TOKEN }}
