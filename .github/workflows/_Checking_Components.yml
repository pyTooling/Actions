name: Verification of Components
run-name: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

# Pairs of jobs, each verifying one component - an action or a job template - in isolation. The nightly release jobs
# publish release pages, so they run only when started by hand.
on:
  push:
    # 'update/rN' carries a version branch's rewritten references; only 'Pipeline.yml' runs there.
    branches-ignore:
      - 'update/**'
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  Build:
    name: Build something
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: 🖉 Build 1
        run: |
          printf -- '%s\n' "Document 1 $(date --utc '+%d.%m.%Y - %H:%M:%S')"   > document1.txt
          printf -- '%s\n' "Analysis log $(date --utc '+%d.%m.%Y - %H:%M:%S')" > analysis.log
          printf -- '%s\n' "Build log $(date --utc '+%d.%m.%Y - %H:%M:%S')"    > build.log

      - name: 📤 Upload artifact
        uses: pyTooling/upload-artifact@v7
        with:
          name: document
          path: |
            document1.txt
            *.log
          if-no-files-found: error
          retention-days: 1

      - name: 🖉 Program
        run: |
          printf -- '%s\n' "Document other $(date --utc '+%d.%m.%Y - %H:%M:%S')" > document1.txt
          printf -- '%s\n' "Document other $(date --utc '+%d.%m.%Y - %H:%M:%S')" > document2.txt
          printf -- '%s\n' "Program $(date --utc '+%d.%m.%Y - %H:%M:%S')"        > program.py

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: other
          path: |
            *.txt
            *.py
          if-no-files-found: error
          retention-days: 1

  NightlyPage:
    uses: ./.github/workflows/PublishReleaseNotes.yml
    if: github.event_name == 'workflow_dispatch'
    needs:
      - Build
    permissions:
      contents: write
      actions:  write
    with:
      can-fail: true
      prerelease: true
      replacements: |
        version=4.2.0
        tool=myTool
        prog=program
      tag: v4.2.0
      title: "Nightly Test Release"
      description: |
        This *nightly* release contains all latest and important artifacts created by %tool%'s CI pipeline.

        # %tool% %version%

        * %prog%

        # Attached files:

        %%ASSETS%%
      assets: |
        document: document1.txt:   Documentation
        document: build.log:       Logfile - %tool% - %tool%
        other:    document2.txt:   SBOM - %version%
        other:    %prog%.py:       Application - %tool% - %version%
        document:!archive1.zip:    Archive 1 - zip
        document:!archive2.tgz:    Archive 2 - tgz
        document:!archive3.tar.gz: Archive 3 - tar.gz
        document:!archive4.tzst:   Archive 4 - tzst
        document:!archive5.tar.zst:Archive 5 - tar.zst
        document:$archive6.tgz:    Archive 6 - tgz + dir
        document:$archive7.tar.gz: Archive 7 - tar.gz + dir
        document:$archive8.tzst:   Archive 8 - tzst + dir
        document:$archive9.tar.zst:Archive 9 - tar.zst + dir
    secrets: inherit

  NightlyPageWithInventory:
    uses: ./.github/workflows/PublishReleaseNotes.yml
    if: github.event_name == 'workflow_dispatch'
    needs:
      - Build
    permissions:
      contents: write
      actions:  write
    with:
      can-fail: true
      replacements: |
        version=4.2.0
        tool=myTool
        prog=program
      tag: inventory
      title: "Nightly Test Release with Inventory"
      description: |
        This *nightly* release contains all latest and important artifacts created by %tool%'s CI pipeline.

        # %tool% %version%

        * %prog%
        * inventory.json
      inventory-json: "inventory.json"
      inventory-version: 4.2.5
      inventory-categories: "kind1,kind2"
      assets: |
        # artifact: file:          labels:    asset title
        document: document1.txt:   doc,html:  Documentation
        document: build.log:       build,log: Logfile - %tool% - %tool%
        other:    document2.txt:   build,SBOM:SBOM - %version%
        other:    %prog%.py:       app,binary:Application - %tool% - %version%
        document:!archive1.zip:               Archive 1 - zip
        document:!archive2.tgz:               Archive 2 - tgz
        document:!archive3.tar.gz:            Archive 3 - tar.gz
        document:!archive4.tzst:              Archive 4 - tzst
        document:!archive5.tar.zst:           Archive 5 - tar.zst
        document:$archive6.tgz:               Archive 6 - tgz + dir
        document:$archive7.tar.gz:            Archive 7 - tar.gz + dir
        document:$archive8.tzst:              Archive 8 - tzst + dir
        document:$archive9.tar.zst:           Archive 9 - tar.zst + dir
    secrets: inherit

  Package:
    uses: pyTooling/Actions/.github/workflows/Package.yml@dev
    with:
      artifact: Components-Package

  PackageCompliance:
    name: 🔍 Check 'pypi_compliant' of Package
    runs-on: ubuntu-26.04
    needs:
      - Package
    steps:
      - name: Check that the example package is reported as not PyPI-compliant
        env:
          PYPI_COMPLIANT: ${{ needs.Package.outputs.pypi_compliant }}
        run: |
          # 'doc/requirements.txt' names pyTooling.Sphinx by a Git URL, which ends up in the 'doc' extra.
          printf -- 'pypi_compliant: %s\n' "${PYPI_COMPLIANT}"
          if [[ "${PYPI_COMPLIANT}" == "" ]]; then
            printf -- "::notice title=PackageCompliance::'Package.yml@dev' has no output 'pypi_compliant' yet.\n"
          elif [[ "${PYPI_COMPLIANT}" != "false" ]]; then
            printf -- "::error title=PackageCompliance::Expected 'false', got '%s'.\n" "${PYPI_COMPLIANT}"
            exit 1
          fi

      - name: 🗑️ Delete the package artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: Components-Package

  PyPIComplianceAction:
    name: 🔍 Check action 'InspectPyPICompliance'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository to access local Action
        uses: actions/checkout@v7

      - name: 🐍 Setup Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build a clean and a dirty fixture package
        run: |
          python -m pip install --disable-pip-version-check build

          writeFixture() {  # <kind> <extras_require>
            local kind="$1" extras="$2"

            mkdir -p "fixtures/${kind}"
            printf -- '%s\n' \
              'from setuptools import setup' \
              '' \
              "setup(name=\"fixture_${kind}\", version=\"1.0.0\", py_modules=[], extras_require=${extras})" \
              > "fixtures/${kind}/setup.py"
            if ! python -m build --outdir "fixtures/${kind}/dist" "fixtures/${kind}"; then
              printf -- "::error title=PyPIComplianceAction::Building the %s fixture failed.\n" "${kind}"
              exit 1
            fi
          }

          reference='fixture_dependency @ git+https://github.com/pyTooling/Actions.git@dev'
          writeFixture "clean" '{"doc": ["sphinx"]}'
          writeFixture "dirty" "{\"doc\": [\"sphinx\", \"${reference}\"], \"all\": [\"${reference}\"]}"

      - name: Check the clean fixture
        id: clean
        uses: ./.github/actions/InspectPyPICompliance
        with:
          directory: fixtures/clean/dist

      - name: Check the dirty fixture
        id: dirty
        uses: ./.github/actions/InspectPyPICompliance
        with:
          directory: fixtures/dirty/dist

      - name: Check the action's verdicts
        env:
          CLEAN: ${{ steps.clean.outputs.pypi_compliant }}
          DIRTY: ${{ steps.dirty.outputs.pypi_compliant }}
        run: |
          errors=0
          printf -- 'clean: %s, dirty: %s\n' "${CLEAN}" "${DIRTY}"
          if [[ "${CLEAN}" != "true" ]]; then
            printf -- "::error title=PyPIComplianceAction::Clean fixture: expected 'true', got '%s'.\n" "${CLEAN}"
            errors=$((errors + 1))
          fi
          if [[ "${DIRTY}" != "false" ]]; then
            printf -- "::error title=PyPIComplianceAction::Dirty fixture: expected 'false', got '%s'.\n" "${DIRTY}"
            errors=$((errors + 1))
          fi
          [[ ${errors} -eq 0 ]] || exit 1
