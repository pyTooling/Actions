name: Update Version Branch

on:
  workflow_call:
    inputs:
      ubuntu_image:
        description: 'Name of the Ubuntu image.'
        type: string
        required: false
        default: 'ubuntu-26.04'
      version:
        description: |
          Released version, as tagged. Its major number selects the version branch: 'v1.2.3' with prefix 'r' targets
          branch 'r1'.
        type: string
        required: true
      prefix:
        description: |
          Prefix of the version branch name, usually 'v' or 'r'.
        type: string
        required: false
        default: 'v'
      major:
        description: |
          Major version number selecting the version branch. When empty, the major number of 'version' is used.
          Set it where the version branch doesn't follow the released version's major - a repository tagging
          'v1.11.0' while publishing a 'v7' branch, for instance.
        type: string
        required: false
        default: ''
      main_branch:
        description: |
          Branch the version branch is updated from.
        type: string
        required: false
        default: 'main'
      update_branch_prefix:
        description: |
          Prefix of the branch carrying the rewritten references, when a rewrite is needed.
        type: string
        required: false
        default: 'update/'

    outputs:
      branch:
        description: |
          Name of the version branch.
        value: ${{ jobs.UpdateVersionBranch.outputs.branch }}
      branch-created:
        description: |
          'true' if the version branch didn't exist and was created by this run.
        value: ${{ jobs.UpdateVersionBranch.outputs.branch-created }}
      head:
        description: |
          Branch the pull-request is opened from: the main branch, or the update branch when references were
          rewritten.
        value: ${{ jobs.UpdateVersionBranch.outputs.head }}
      rewritten:
        description: |
          'true' if references to this repository had to be rewritten for the version branch.
        value: ${{ jobs.UpdateVersionBranch.outputs.rewritten }}
      pull-request:
        description: |
          URL of the created or updated pull-request, empty if none was needed.
        value: ${{ jobs.UpdateVersionBranch.outputs.pull-request }}

jobs:
  UpdateVersionBranch:
    name: 🔀 Update version branch from '${{ inputs.main_branch }}'
    runs-on: ${{ inputs.ubuntu_image || 'ubuntu-26.04' }}

    permissions:
      contents:      write   # required to create the version branch and push the update branch
      pull-requests: write   # required to open the pull-request

    outputs:
      branch:         ${{ steps.version.outputs.branch }}
      branch-created: ${{ steps.version.outputs.branch-created }}
      head:           ${{ steps.rewrite.outputs.head }}
      rewritten:      ${{ steps.rewrite.outputs.rewritten }}
      pull-request:   ${{ steps.pullrequest.outputs.pull-request }}

    steps:
      - name: ⏬ Checkout the main branch
        uses: actions/checkout@v7
        with:
          ref:         ${{ inputs.main_branch }}
          fetch-depth: 0

      - name: 🔢 Resolve and create the version branch
        id: version
        shell: bash
        run: |
          # 🔢 Resolve and create the version branch
          set +e

          ANSI_CYAN=$'\x1b[36m'
          ANSI_LIGHT_RED=$'\x1b[91m'
          ANSI_LIGHT_GREEN=$'\x1b[92m'
          ANSI_LIGHT_YELLOW=$'\x1b[93m'
          ANSI_NOCOLOR=$'\x1b[0m'

          export GH_TOKEN=${{ github.token }}

          # The version may be tagged with or without a prefix of its own ('v1.2.3' as well as '1.2.3'), and the
          # branch prefix is independent of it: 'v1.2.3' with prefix 'r' is branch 'r1'. Where the version branch
          # doesn't follow the released version's major at all, 'major' states it.
          if [[ -n "${{ inputs.major }}" ]]; then
            major="${{ inputs.major }}"
            majorSource="the 'major' parameter"
          else
            core="${{ inputs.version }}"
            core="${core#[vr]}"
            major="${core%%.*}"
            majorSource="'${{ inputs.version }}'"
          fi

          printf "%s\n"        "${ANSI_CYAN}Updating the version branch for '${{ inputs.version }}' ...${ANSI_NOCOLOR}"
          printf "  %-16s%s\n" "Repository:"  "${{ github.repository }}"
          printf "  %-16s%s\n" "Version:"     "${{ inputs.version }}"
          printf "  %-16s%s\n" "Major:"       "${major} (from ${majorSource})"
          printf "  %-16s%s\n" "Prefix:"      "${{ inputs.prefix }}"
          printf "  %-16s%s\n" "Main branch:" "${{ inputs.main_branch }}"
          printf "%s\n" ""

          if [[ ! "${major}" =~ ^[0-9]+$ ]]; then
            printf "%s\n" "${ANSI_LIGHT_RED}No major version number in ${majorSource}.${ANSI_NOCOLOR}"
            printf "::error title=%s::%s\n" "UpdateVersionBranch" "No major version number in ${majorSource}."
            exit 1
          fi

          branch="${{ inputs.prefix }}${major}"
          printf "branch=%s\n"         "${branch}" >> "${GITHUB_OUTPUT}"
          printf "branch-created=%s\n" "false"     >> "${GITHUB_OUTPUT}"

          printf "%s" "Checking version branch '${branch}' ... "
          if gh api "repos/${{ github.repository }}/git/ref/heads/${branch}" > /dev/null 2>&1; then
            printf "%s\n" "${ANSI_LIGHT_GREEN}[FOUND]${ANSI_NOCOLOR}"
            exit 0
          fi
          printf "%s\n" "${ANSI_LIGHT_YELLOW}[MISSING]${ANSI_NOCOLOR}"

          # A new major branches off the previous major, not off the main branch: it has to stay *behind* the main
          # branch, otherwise there is nothing to open a pull-request about.
          previous=""
          previousMajor=-1
          while read -r candidate; do
            [[ "${candidate}" =~ ^${{ inputs.prefix }}([0-9]+)$ ]] || continue
            candidateMajor="${BASH_REMATCH[1]}"
            if [[ ${candidateMajor} -lt ${major} && ${candidateMajor} -gt ${previousMajor} ]]; then
              previousMajor="${candidateMajor}"
              previous="${candidate}"
            fi
          done < <(gh api "repos/${{ github.repository }}/branches" --paginate --jq '.[].name' 2> /dev/null)

          if [[ -n "${previous}" ]]; then
            printf "  %s\n" "Previous version branch: ${ANSI_LIGHT_GREEN}${previous}${ANSI_NOCOLOR}"
            source="heads/${previous}"
          else
            printf "  %s\n" "${ANSI_LIGHT_YELLOW}No previous version branch — branching off '${{ inputs.main_branch }}'.${ANSI_NOCOLOR}"
            source="heads/${{ inputs.main_branch }}"
          fi

          sha="$(gh api "repos/${{ github.repository }}/git/ref/${source}" --jq '.object.sha' 2>&1)"
          if [[ $? -ne 0 ]]; then
            printf "%s\n" "${ANSI_LIGHT_RED}Couldn't read '${source}'.${ANSI_NOCOLOR}"
            printf "%s\n" "$(sed 's/^/  ↪ /g' <<< "${sha}")"
            printf "::error title=%s::%s\n" "UpdateVersionBranch" "Couldn't read '${source}': ${sha//$'\n'/%0A}"
            exit 1
          fi

          printf "%s" "Creating branch '${branch}' at ${sha:0:7} ... "
          messages="$(gh api --method POST "repos/${{ github.repository }}/git/refs" --field "ref=refs/heads/${branch}" --field "sha=${sha}" 2>&1)"
          if [[ $? -ne 0 ]]; then
            printf "%s\n" "${ANSI_LIGHT_RED}[FAILED]${ANSI_NOCOLOR}"
            printf "%s\n" "$(sed 's/^/  ↪ /g' <<< "${messages}")"
            printf "::error title=%s::%s\n" "UpdateVersionBranch" "Couldn't create branch '${branch}': ${messages//$'\n'/%0A}"
            exit 1
          fi
          printf "%s\n" "${ANSI_LIGHT_GREEN}[OK]${ANSI_NOCOLOR}"
          printf "branch-created=%s\n" "true" >> "${GITHUB_OUTPUT}"

      - name: ✏ Rewrite references to this repository
        id: rewrite
        shell: bash
        run: |
          # ✏ Rewrite references to this repository
          set +e

          ANSI_CYAN=$'\x1b[36m'
          ANSI_LIGHT_RED=$'\x1b[91m'
          ANSI_LIGHT_GREEN=$'\x1b[92m'
          ANSI_LIGHT_YELLOW=$'\x1b[93m'
          ANSI_NOCOLOR=$'\x1b[0m'

          # A workflow, action or badge on the version branch has to reference *that* branch. Only self-references
          # are rewritten - a reference to another repository ('pyTooling/Actions@r8', 'actions/checkout@v7') is a
          # separate decision and is left alone.
          repoPattern="${{ github.repository }}"
          repoPattern="${repoPattern//./\\.}"

          printf "%s\n" "${ANSI_CYAN}Rewriting references to '${{ github.repository }}' to '${{ steps.version.outputs.branch }}' ...${ANSI_NOCOLOR}"

          changedFiles=()
          while IFS= read -r file; do
            [[ -f "${file}" ]] || continue
            sed -E --in-place \
              -e "s|(${repoPattern}(/[^@[:space:]\"'\`)]*)?)@[A-Za-z0-9._/-]+|\1@${{ steps.version.outputs.branch }}|g" \
              -e "s|(actions/workflow/status/${repoPattern}/[^?]*\?branch=)[A-Za-z0-9._%/-]+|\1${{ steps.version.outputs.branch }}|g" \
              "${file}"
            if ! git diff --quiet -- "${file}"; then
              changedFiles+=("${file}")
              printf "  ✏ %s\n" "${file}"
            fi
          done < <(git ls-files '*.yml' '*.yaml' '*.md')

          if [[ ${#changedFiles[@]} -eq 0 ]]; then
            printf "%s\n" "${ANSI_LIGHT_GREEN}No reference had to be rewritten — the pull-request is a plain merge.${ANSI_NOCOLOR}"
            printf "head=%s\n"      "${{ inputs.main_branch }}" >> "${GITHUB_OUTPUT}"
            printf "rewritten=%s\n" "false"          >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          printf "%s\n" ""
          git --no-pager diff --unified=0 -- "${changedFiles[@]}"
          printf "%s\n" ""

          updateBranch="${{ inputs.update_branch_prefix || 'update/' }}${{ steps.version.outputs.branch }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "${updateBranch}"
          git add -- "${changedFiles[@]}"
          git commit -q -m "Rewrite references to '${{ steps.version.outputs.branch }}' for the ${{ steps.version.outputs.branch }} branch." -m "Automatically written by the 'UpdateVersionBranch' workflow."

          printf "%s" "Pushing '${updateBranch}' ... "
          messages="$(git push --force origin "HEAD:refs/heads/${updateBranch}" 2>&1)"
          if [[ $? -ne 0 ]]; then
            printf "%s\n" "${ANSI_LIGHT_RED}[FAILED]${ANSI_NOCOLOR}"
            printf "%s\n" "$(sed 's/^/  ↪ /g' <<< "${messages}")"
            printf "::error title=%s::%s\n" "UpdateVersionBranch" "Couldn't push '${updateBranch}': ${messages//$'\n'/%0A}"
            exit 1
          fi
          printf "%s\n" "${ANSI_LIGHT_GREEN}[OK]${ANSI_NOCOLOR}"

          printf "head=%s\n"      "${updateBranch}" >> "${GITHUB_OUTPUT}"
          printf "rewritten=%s\n" "true"            >> "${GITHUB_OUTPUT}"

      - name: 🔀 Open the pull-request
        id: pullrequest
        shell: bash
        run: |
          # 🔀 Open the pull-request
          set +e

          ANSI_LIGHT_RED=$'\x1b[91m'
          ANSI_LIGHT_GREEN=$'\x1b[92m'
          ANSI_NOCOLOR=$'\x1b[0m'

          export GH_TOKEN=${{ github.token }}

          printf "pull-request=%s\n" "" >> "${GITHUB_OUTPUT}"

          printf "%s" "Comparing '${{ steps.version.outputs.branch }}' with '${{ steps.rewrite.outputs.head }}' ... "
          ahead="$(gh api "repos/${{ github.repository }}/compare/${{ steps.version.outputs.branch }}...${{ steps.rewrite.outputs.head }}" --jq '.ahead_by' 2>&1)"
          if [[ $? -ne 0 ]]; then
            printf "%s\n" "${ANSI_LIGHT_RED}[FAILED]${ANSI_NOCOLOR}"
            printf "%s\n" "$(sed 's/^/  ↪ /g' <<< "${ahead}")"
            printf "::error title=%s::%s\n" "UpdateVersionBranch" "Couldn't compare '${{ steps.version.outputs.branch }}' with '${{ steps.rewrite.outputs.head }}': ${ahead//$'\n'/%0A}"
            exit 1
          fi
          printf "%s\n" "${ANSI_LIGHT_GREEN}[OK]${ANSI_NOCOLOR} (${ahead} commit(s) ahead)"

          if [[ "${ahead}" == "0" ]]; then
            printf "%s\n" ""
            printf "%s\n" "${ANSI_LIGHT_GREEN}'${{ steps.version.outputs.branch }}' already matches '${{ steps.rewrite.outputs.head }}' — nothing to update.${ANSI_NOCOLOR}"
            exit 0
          fi

          if [[ "${{ steps.rewrite.outputs.rewritten }}" == "true" ]]; then
            rewriteNote="* References to this repository were rewritten to \`${{ steps.version.outputs.branch }}\` in a commit on \`${{ steps.rewrite.outputs.head }}\`."
          else
            rewriteNote="* No reference to this repository had to be rewritten, so this is a plain merge of \`${{ inputs.main_branch }}\`."
          fi

          title="Updating ${{ steps.version.outputs.branch }} from ${{ inputs.version }}"
          # Built line by line rather than from a here-document: a here-document's terminator has to start at column
          # zero, which would end this YAML block scalar.
          body="$(printf "%s\n" \
            "This pull-request advances the \`${{ steps.version.outputs.branch }}\` branch to the **${{ inputs.version }}** release." \
            "" \
            "Consumers pin \`${{ github.repository }}@${{ steps.version.outputs.branch }}\`, so merging this makes that reference point at \`${{ inputs.version }}\`." \
            "" \
            "${rewriteNote}" \
            "* Release: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }}" \
            "* Changes: https://github.com/${{ github.repository }}/compare/${{ steps.version.outputs.branch }}...${{ steps.rewrite.outputs.head }}" \
            "" \
            "Opened automatically by the \`UpdateVersionBranch\` workflow.")"

          # A patch release on an existing version branch finds the pull-request from the previous one still open.
          existing="$(gh pr list --repo "${{ github.repository }}" --base "${{ steps.version.outputs.branch }}" --head "${{ steps.rewrite.outputs.head }}" --state open --json number --jq '.[0].number' 2> /dev/null)"
          if [[ -n "${existing}" ]]; then
            printf "%s" "Updating pull-request #${existing} ... "
            messages="$(gh api --method PATCH "repos/${{ github.repository }}/pulls/${existing}" --field "title=${title}" --field "body=${body}" --jq '.html_url' 2>&1)"
            if [[ $? -ne 0 ]]; then
              printf "%s\n" "${ANSI_LIGHT_RED}[FAILED]${ANSI_NOCOLOR}"
              printf "%s\n" "$(sed 's/^/  ↪ /g' <<< "${messages}")"
              printf "::error title=%s::%s\n" "UpdateVersionBranch" "Couldn't update pull-request #${existing}: ${messages//$'\n'/%0A}"
              exit 1
            fi
            printf "%s\n" "${ANSI_LIGHT_GREEN}[OK]${ANSI_NOCOLOR}"
            printf "  %s\n" "${messages}"
            printf "pull-request=%s\n" "${messages}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          printf "%s" "Creating pull-request '${title}' ... "
          messages="$(gh pr create --repo "${{ github.repository }}" --base "${{ steps.version.outputs.branch }}" --head "${{ steps.rewrite.outputs.head }}" --title "${title}" --body "${body}" 2>&1)"
          if [[ $? -ne 0 ]]; then
            printf "%s\n" "${ANSI_LIGHT_RED}[FAILED]${ANSI_NOCOLOR}"
            printf "%s\n" "$(sed 's/^/  ↪ /g' <<< "${messages}")"
            printf "::error title=%s::%s\n" "UpdateVersionBranch" "Couldn't create the pull-request: ${messages//$'\n'/%0A}"
            exit 1
          fi
          printf "%s\n" "${ANSI_LIGHT_GREEN}[OK]${ANSI_NOCOLOR}"
          printf "  %s\n" "${messages}"
          printf "pull-request=%s\n" "${messages}" >> "${GITHUB_OUTPUT}"
