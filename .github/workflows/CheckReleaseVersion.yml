name: Check Release Version

on:
  workflow_call:
    inputs:
      ubuntu_image:
        description: 'Name of the Ubuntu image.'
        required: false
        default: 'ubuntu-26.04'
        type: string
      version:
        description: 'Version to be released, e.g. v1.2.3.'
        required: true
        type: string
      check_pypi_duplicate:
        description: "Fail if PyPI already has a release of 'version' for 'pypi_package'."
        required: false
        default: 'false'
        type: string
      pypi_package:
        description: 'Name of the package on PyPI.'
        required: false
        default: ''
        type: string

jobs:
  CheckReleaseVersion:
    name: 🔍 Check that '${{ inputs.version }}' isn't released yet
    runs-on: ${{ inputs.ubuntu_image }}

    steps:
      - name: 🔍 Check PyPI for an existing release
        if: inputs.check_pypi_duplicate == 'true'
        env:
          VERSION: ${{ inputs.version }}
          PACKAGE: ${{ inputs.pypi_package }}
        run: |
          set +e

          ANSI_LIGHT_RED=$'\x1b[91m'
          ANSI_LIGHT_GREEN=$'\x1b[92m'
          ANSI_NOCOLOR=$'\x1b[0m'

          if [[ -z "${PACKAGE}" ]]; then
            printf "::error title=CheckReleaseVersion::'check_pypi_duplicate' requires 'pypi_package'.\n"
            exit 1
          fi

          # PyPI normalizes a 'v' prefix, but doesn't know an 'r' prefix.
          version="${VERSION}"
          if [[ "${version}" =~ ^r[0-9] ]]; then
            version="${version:1}"
          fi

          printf "Check if PyPI has release '%s' of package '%s' ... " "${version}" "${PACKAGE}"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 5 \
            "https://pypi.org/pypi/${PACKAGE}/${version}/json")"
          if [[ "${status}" == "404" ]]; then
            printf "${ANSI_LIGHT_GREEN}[NOT RELEASED]${ANSI_NOCOLOR}\n"
          elif [[ "${status}" == "200" ]]; then
            printf "${ANSI_LIGHT_RED}[RELEASED]${ANSI_NOCOLOR}\n"
            printf "  ${ANSI_LIGHT_RED}https://pypi.org/project/%s/%s/${ANSI_NOCOLOR}\n" "${PACKAGE}" "${version}"
            printf "::error title=CheckReleaseVersion::PyPI already has release '%s' of '%s'.\n" "${version}" "${PACKAGE}"
            exit 1
          else
            printf "${ANSI_LIGHT_RED}[FAILED]${ANSI_NOCOLOR}\n"
            printf "::error title=CheckReleaseVersion::Couldn't query PyPI (HTTP status '%s').\n" "${status}"
            exit 1
          fi

      - name: 🔍 No registry to check
        if: inputs.check_pypi_duplicate != 'true'
        run: |
          printf "No package registry check is enabled.\n"
