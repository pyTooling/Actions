name: Pipeline

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}  # tag pushes can publish a release, so never cancel those

jobs:
  Prepare:
    uses: pyTooling/Actions/.github/workflows/PrepareJob.yml@dev

  # The verification workflows exercise the job templates of this repository. They are called here, so one pipeline
  # decides whether a release is tagged, instead of each of them deciding on its own.
  Parameters:
    uses: ./.github/workflows/_Checking_Parameters.yml
    secrets: inherit

  JobTemplates:
    uses: ./.github/workflows/_Checking_JobTemplates.yml
    secrets: inherit

  SimplePackage:
    uses: ./.github/workflows/_Checking_SimplePackage_Pipeline.yml
    secrets: inherit

  NamespacePackage:
    uses: ./.github/workflows/_Checking_NamespacePackage_Pipeline.yml
    secrets: inherit

  AvailableRunners:
    uses: ./.github/workflows/_Checking_AvailableRunners.yml
    secrets: inherit

  # A release commit is tagged only if every verification succeeded. The new tag starts this pipeline again, and that
  # run publishes the release page and proposes the version branch update.
  TriggerTaggedRelease:
    uses: pyTooling/Actions/.github/workflows/TagReleaseCommit.yml@dev
    needs:
      - Prepare
      - Parameters
      - JobTemplates
      - SimplePackage
      - NamespacePackage
      - AvailableRunners
    if: needs.Prepare.outputs.is_release_commit == 'true'
    permissions:
      contents: write  # required for create tag
      actions:  write  # required for trigger workflow
    with:
      version:  ${{ needs.Prepare.outputs.version }}
      auto_tag: ${{ needs.Prepare.outputs.is_release_commit }}
    secrets: inherit

  ReleasePage:
    uses: pyTooling/Actions/.github/workflows/PublishReleaseNotes.yml@dev
    needs:
      - Prepare
      - Parameters
      - JobTemplates
      - SimplePackage
      - NamespacePackage
      - AvailableRunners
    if: needs.Prepare.outputs.is_release_tag == 'true'
    permissions:
      contents: write
      actions:  write
    with:
      tag: ${{ needs.Prepare.outputs.version }}
    secrets: inherit

  # Consumers pin '@r8', so every release has to move that branch. This opens the pull-request doing it, titled like
  # 'Updating r8 from v8.1.0'.
  UpdateVersionBranch:
    uses: pyTooling/Actions/.github/workflows/UpdateVersionBranch.yml@dev
    needs:
      - Prepare
      - ReleasePage
    if: needs.Prepare.outputs.is_release_tag == 'true'
    permissions:
      contents:      write   # required to create a version branch
      pull-requests: write   # required to open the pull-request
    with:
      version: ${{ needs.Prepare.outputs.version }}
      prefix:  'r'
